<h1>Потягусь</h1>
<p>Морда спрощена до крапки — жодних брів, повік і рота, як у першоджерела.
Нахабність тепер несе поза: шия вперед, крок уперед, іде просто на тебе.
Кожен — 10–14 контурів, крило й лапи окремими фігурами.</p>
