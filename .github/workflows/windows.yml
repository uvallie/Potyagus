# Builds the Windows version (windows/) and attaches a ready-to-run zip to the run.
# The Mac app is not touched by this workflow.
name: Windows build

on:
  push:
    paths: ["windows/**", "web/**", "data/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "web/**", "data/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only for the screenshots ref below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        shell: pwsh
        run: ./windows/build.ps1 -Runtime win-x64
      - name: Smoke test (--check, --devices)
        shell: pwsh
        run: |
          $exe = "windows/dist/Potyagus/Potyagus.exe"
          if (-not (Test-Path $exe)) { throw "no exe" }
          foreach ($f in "web/overlay.html", "web/clips/idle.mp4", "web/sfx/honk.m4a", "exercises.json") {
            if (-not (Test-Path "windows/dist/Potyagus/$f")) { throw "missing $f" }
          }
          $p = Start-Process $exe -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--check exited $($p.ExitCode)" }
          $p = Start-Process $exe -ArgumentList "--devices" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--devices exited $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Potyagus-windows-x64
          path: windows/dist/Potyagus/
      - name: Screen test (show the goose, start, finish, screenshots)
        shell: pwsh
        run: ./windows/ci/screen-test.ps1 -Exe windows/dist/Potyagus/Potyagus.exe -Out windows/dist/screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Potyagus-windows-screens
          path: windows/dist/screens/
      # Screenshots also go to a hidden ref (not a branch, not shown in the UI), so they can be
      # fetched with `git fetch origin refs/ci-screens/windows` without downloading artifacts.
      - name: Publish screenshots to refs/ci-screens/windows
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          [ -d windows/dist/screens ] || exit 0
          cd windows/dist/screens
          git init -q
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Windows screen test for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/ci-screens/windows
