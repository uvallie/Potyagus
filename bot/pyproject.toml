[project]
name = "potyagus-bot"
version = "0.1.0"
description = "Potyagus (Goose Up): a cartoon goose in Telegram that writes first, brings 30-second warm-ups and remembers your promises."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21",
    "anthropic>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["goose_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
